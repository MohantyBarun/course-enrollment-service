name: CI

on:
  push:
    branches: [master, seatsure]
  pull_request:
    branches: [master, seatsure]

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      # Integration tests skip themselves when Docker isn't usable (handy on laptops). In CI that would
      # hide them entirely, so any skipped test fails the build here.
      - name: Fail if any test was skipped
        run: |
          skipped=$(grep -hoE '<testsuite [^>]*skipped="[0-9]+"' target/surefire-reports/TEST-*.xml \
            | grep -oE 'skipped="[0-9]+"' | grep -oE '[0-9]+' | awk '{ s += $1 } END { print s + 0 }')
          echo "Skipped tests: $skipped"
          if [ "$skipped" -ne 0 ]; then
            grep -lE 'skipped="[1-9]' target/surefire-reports/TEST-*.xml
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t seatsure:ci .
