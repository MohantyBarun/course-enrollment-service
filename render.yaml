# Render Blueprint: Dashboard -> New -> Blueprint -> select this repo.
# Values marked "sync: false" are secrets; Render prompts for them on first deploy.
services:
  - type: web
    name: student-service
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    # Only redeploy the backend when backend files change (this repo also holds the frontend)
    buildFilter:
      ignoredPaths:
        - frontend/**
        - "**/*.md"
        - ops/**
        - docker-compose.yml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Public demo: seeds sample data and enables "Try as Admin/Student" on the login page
      - key: DEMO_ENABLED
        value: "true"
      # Nightly reset (03:00 IST) so visitors' changes don't accumulate; wipes students & academic data, keeps admins
      - key: DEMO_RESET_CRON
        value: "0 0 3 * * *"
      - key: JWT_SECRET
        generateValue: true          # random secret generated by Render
      - key: DB_URL                  # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS    # e.g. https://your-app.vercel.app
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
