# Shared settings. Profile-specific values live in application-dev / application-prod.
# The profile defaults to dev; set SPRING_PROFILES_ACTIVE=prod in production.
spring.application.name=SeatSure
spring.profiles.active=dev

# Render (and most PaaS hosts) inject the port to listen on via $PORT
server.port=${PORT:8080}

#Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatsure}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#JPA (the PostgreSQL dialect is auto-detected). Flyway owns the schema; Hibernate only checks
# at startup that the entities match it, so a bad deploy fails fast instead of altering tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Lazy associations of a page of results load in one IN (...) query, not one query each (no N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Lets pgjdbc turn batched INSERTs into multi-row INSERTs (the demo seed writes ~40k rows)
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Flyway: migrations in src/main/resources/db/migration

# Auth: 15-minute access tokens (JWT), 7-day rotating refresh tokens (opaque, stored hashed)
jwt.secret=${JWT_SECRET}
jwt.access.expiration=900000
app.auth.refresh-ttl=P7D

# Bookings. The audience's time zone decides what "today" and a show's date are.
app.zone=Asia/Kolkata
app.booking.convenience-fee-paise=2500
app.booking.cancellation-cutoff=PT2H

# Checkout: picked seats are held this long while the customer pays; lapsed holds are swept this often
app.holds.ttl=PT10M
app.holds.expiry-interval=PT10S

# Payments (mock gateway). Webhooks are signed with HMAC-SHA256; if PAYMENT_WEBHOOK_SECRET is unset,
# a secret is derived from JWT_SECRET. The mock gateway delivers webhooks to this same server unless
# PAYMENT_WEBHOOK_URL says otherwise.
app.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
app.payments.webhook-url=${PAYMENT_WEBHOOK_URL:}
app.payments.mock.delivery-interval=PT2S

# CORS: comma-separated origins (wildcard patterns allowed, e.g. https://*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Initial admin account, created on startup if both values are set and it doesn't exist yet
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------- observability
# Liveness (used by Render's health check) never depends on external systems, so a Redis or
# RabbitMQ outage degrades features instead of getting the container restarted.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# /actuator/prometheus needs HTTP Basic (user "metrics"); disabled while no password is set
app.metrics.password=${METRICS_PASSWORD:}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# @Observed on service methods -> timers (and spans) such as auth.login and enrollment.enroll
management.observations.annotations.enabled=true
# Tracing: trace/span ids are always in the logs; spans are exported only when
# MANAGEMENT_OTLP_TRACING_ENDPOINT is set (e.g. http://localhost:4318/v1/traces for Jaeger)
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-},%X{requestId:-}] 

# ---------------------------------------------------------------- redis (cache + rate limits)
# Off: in-process Caffeine cache and in-memory rate limits (fine for a single instance).
# On: shared Redis, e.g. REDIS_URL=rediss://default:<password>@<host>:6379 (Upstash)
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=${app.redis.enabled}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login-per-minute=10
app.rate-limit.register-per-minute=5
app.rate-limit.demo-login-per-minute=20
app.rate-limit.refresh-per-minute=30
app.rate-limit.api-per-minute=300

# ---------------------------------------------------------------- messaging (outbox + RabbitMQ)
# Off: outbox events are handled in-process by the relay. On: relayed to RabbitMQ and consumed
# from a queue with retries and a dead-letter queue, e.g. RABBITMQ_URL=amqps://user:pass@host/vhost
app.messaging.rabbit.enabled=${RABBIT_ENABLED:false}
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=3
spring.rabbitmq.listener.simple.retry.max-interval=30s
# After the retries, reject without requeue -> the queue's dead-letter exchange -> DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Broker/SMTP outages delay notifications; they don't make the app unhealthy
management.health.rabbit.enabled=${app.messaging.rabbit.enabled}
management.health.mail.enabled=false

app.outbox.poll-interval=PT30S
app.outbox.batch-size=50
app.outbox.max-attempts=10
app.outbox.retention=P7D

# ---------------------------------------------------------------- email
# Real SMTP is used when SPRING_MAIL_HOST is set (plus SPRING_MAIL_PORT/USERNAME/PASSWORD);
# otherwise emails are only logged. On a public demo, real email goes only to the addresses (or
# "@domain"s) in MAIL_ALLOWED_RECIPIENTS, since visitors can sign up with any address.
app.mail.from=${MAIL_FROM:SeatSure <no-reply@seatsure.dev>}
app.mail.allowed-recipients=${MAIL_ALLOWED_RECIPIENTS:}
# Links in emails (e.g. "View your ticket") point here
app.mail.app-url=${APP_URL:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Circuit breaker around SMTP: after half of the last 10 sends fail, stop calling it for a minute
resilience4j.circuitbreaker.instances.smtp.sliding-window-size=10
resilience4j.circuitbreaker.instances.smtp.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.smtp.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.smtp.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.smtp.permitted-number-of-calls-in-half-open-state=2
# Same for Redis (rate limiter): while open, limits fail open without waiting for timeouts
resilience4j.circuitbreaker.instances.redis.sliding-window-size=20
resilience4j.circuitbreaker.instances.redis.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=30s

# ---------------------------------------------------------------- idempotency & encryption
app.idempotency.ttl=PT24H
# AES-256 key (base64, 32 bytes) for data at rest such as stored idempotent responses.
# If unset, a separate key is derived from JWT_SECRET.
app.crypto.key=${DATA_ENCRYPTION_KEY:}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Demo mode: seeds cinemas, movies, shows and bookings around today, and enables "Try as Admin /
# Customer" (passwordless demo accounts). For public demo deployments only. The reset cron reseeds
# daily so the shows stay current (it wipes the catalog, bookings and customer accounts; admins are kept).
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.admin-email=demo.admin@seatsure.dev
app.demo.customer-email=demo.customer@seatsure.dev
app.demo.reset-cron=${DEMO_RESET_CRON:-}

# ---------------------------------------------------------------- live seat map
# Seat changes are announced with PostgreSQL NOTIFY (delivered only on commit) and pushed to open
# seat maps over Server-Sent Events. Each instance keeps one extra database connection for LISTEN.
app.realtime.enabled=${REALTIME_ENABLED:true}
