# Production (Render + Neon). Every secret comes from environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS, ADMIN_EMAIL, ADMIN_PASSWORD
# Public demo (seeded cinemas, movies and shows; nightly reset): DEMO_ENABLED=true, DEMO_RESET_CRON
# Optional: APP_URL (links in emails), PAYMENT_WEBHOOK_SECRET (derived from JWT_SECRET if unset)
# The database must start empty or hold SeatSure's own Flyway history: Flyway refuses to start
# on another application's migrations (a checksum/description mismatch fails the deploy).
spring.jpa.show-sql=false

# The free tiers have tight connection and memory limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Render terminates HTTPS at its proxy; honour X-Forwarded-* so generated URLs
# (Location headers, Swagger server URL) use https and the public host
server.forward-headers-strategy=framework
# Render's chain, as seen at GET /admin/system/client-ip (2026-11-03):
#   X-Forwarded-For: [anything the client sent...], <client>, <Cloudflare edge>, <Render LB 10.x>; TCP peer ::1
# Three proxies append after the client (Cloudflare, Render's edge, Render's load balancer), so the
# client is 3 hops left of the peer. Fewer would put every visitor in one rate-limit bucket.
app.client-ip.trusted-proxies=${TRUSTED_PROXIES:3}

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# JSON logs (Elastic Common Schema), including MDC fields such as traceId and requestId
logging.structured.format.console=ecs
